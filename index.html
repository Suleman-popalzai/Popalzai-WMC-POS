<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>MovieSP</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
/* ── TOKENS ─────────────────────────────── */
:root {
  --bg:       #1b0b2a;
  --surface:  #141417;
  --card:     #1a1a1f;
  --border:   #2a2a32;
  --accent:   #e8b84b;
  --accent2:  #c0392b;
  --text:     #eeeef0;
  --muted:    #888896;
  --dim:      #44444e;
  --radius:   10px;
  --tr:       0.18s ease;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;font-size:15px;line-height:1.55;min-height:100vh}

/* ── SCROLLBAR ───────────────────────────── */
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}

/* ── HEADER ──────────────────────────────── */
header{background:var(--surface);border-bottom:1px solid var(--border);padding:0 2rem;display:flex;align-items:center;justify-content:space-between;height:58px;position:sticky;top:0;z-index:100}
.logo{font-family:'Bebas Neue',sans-serif;font-size:1.7rem;letter-spacing:.08em;color:var(--accent)}
.logo span{color:var(--text)}
.header-stats{display:flex;gap:1.5rem}
.stat{font-size:.72rem;color:var(--muted);text-align:right}
.stat strong{display:block;font-size:1rem;font-weight:600;color:var(--text)}

/* ── TOOLBAR ─────────────────────────────── */
.toolbar{display:flex;align-items:center;gap:.6rem;padding:1rem 2rem;background:var(--surface);border-bottom:1px solid var(--border);flex-wrap:wrap}
.toolbar input[type=text],.toolbar select{background:var(--card);border:1px solid var(--border);color:var(--text);border-radius:var(--radius);padding:.45rem .8rem;font-size:.82rem;font-family:inherit;outline:none;transition:border-color var(--tr)}
.toolbar input[type=text]{flex:1;min-width:160px}
.toolbar input[type=text]:focus,.toolbar select:focus{border-color:var(--accent)}
.toolbar select{cursor:pointer;min-width:130px}
.toolbar select option{background:var(--card)}
.btn{display:inline-flex;align-items:center;gap:.4rem;padding:.45rem 1rem;border-radius:var(--radius);font-size:.82rem;font-weight:500;font-family:inherit;cursor:pointer;border:none;transition:all var(--tr)}
.btn-primary{background:var(--accent);color:#111}
.btn-primary:hover{background:#f0c75a}
.btn-ghost{background:transparent;border:1px solid var(--border);color:var(--muted)}
.btn-ghost:hover{border-color:var(--text);color:var(--text)}
.btn-danger{background:rgba(192,57,43,.15);border:1px solid rgba(192,57,43,.35);color:#e74c3c}
.btn-danger:hover{background:rgba(192,57,43,.28)}
.btn-sm{padding:.3rem .65rem;font-size:.75rem}

/* ── MAIN GRID ───────────────────────────── */
main{padding:1.5rem 2rem;max-width:1400px;margin:0 auto}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(195px,1fr));gap:1rem}

/* ── MOVIE CARD ──────────────────────────── */
.movie-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;display:flex;flex-direction:column;transition:transform var(--tr),border-color var(--tr)}
.movie-card:hover{transform:translateY(-3px);border-color:var(--dim)}
.poster-wrap{position:relative;aspect-ratio:2/3;background:#111115;overflow:hidden;flex-shrink:0}
.poster-wrap img{width:100%;height:100%;object-fit:cover;display:block}
.poster-placeholder{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:3rem;background:#0f0f13}
.card-badge{position:absolute;top:7px;left:7px;background:rgba(0,0,0,.72);color:var(--accent);font-size:.7rem;font-weight:600;padding:3px 7px;border-radius:5px;font-family:'Bebas Neue',sans-serif;letter-spacing:.07em}
.card-actions{position:absolute;top:7px;right:7px;display:flex;gap:5px;opacity:0;transition:opacity var(--tr)}
.movie-card:hover .card-actions{opacity:1}
.icon-btn{width:28px;height:28px;border-radius:50%;background:rgba(0,0,0,.68);border:none;color:var(--text);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background var(--tr)}
.icon-btn:hover{background:rgba(0,0,0,.9)}
.icon-btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.card-body{padding:.75rem .85rem .85rem;display:flex;flex-direction:column;gap:4px;flex:1}
.card-title{font-size:.88rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-meta{font-size:.72rem;color:var(--muted);display:flex;gap:.6rem;flex-wrap:wrap}
.card-meta span{display:flex;align-items:center;gap:3px}
.trailer-link{display:inline-flex;align-items:center;gap:.3rem;margin-top:auto;padding-top:6px;font-size:.72rem;color:var(--accent);text-decoration:none;opacity:.8;transition:opacity var(--tr)}
.trailer-link:hover{opacity:1}
.trailer-link svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ── EMPTY STATE ─────────────────────────── */
#empty{display:none;text-align:center;padding:5rem 1rem;color:var(--muted);grid-column:1/-1}
#empty svg{width:52px;height:52px;stroke:var(--dim);fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;margin-bottom:1rem}

/* ── MODAL OVERLAY ───────────────────────── */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.78);z-index:200;align-items:center;justify-content:center;padding:1rem}
.overlay.open{display:flex}
.modal{background:var(--card);border:1px solid var(--border);border-radius:14px;width:100%;max-width:480px;max-height:90vh;overflow-y:auto;padding:1.6rem 1.8rem}
.modal h2{font-family:'Bebas Neue',sans-serif;font-size:1.5rem;letter-spacing:.06em;margin-bottom:1.2rem;color:var(--accent)}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:.8rem}
.form-grid .full{grid-column:1/-1}
label{font-size:.75rem;color:var(--muted);display:block;margin-bottom:.3rem}
input[type=text],input[type=number],input[type=url],textarea{width:100%;background:var(--surface);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:.5rem .75rem;font-size:.85rem;font-family:inherit;outline:none;transition:border-color var(--tr)}
input:focus,textarea:focus{border-color:var(--accent)}
textarea{resize:vertical;min-height:60px}

/* ── PICTURE PREVIEW ─────────────────────── */
.preview-wrap{grid-column:1/-1;display:flex;gap:1rem;align-items:flex-start}
.preview-box{width:90px;height:135px;border-radius:8px;background:var(--surface);border:1px dashed var(--border);overflow:hidden;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:var(--dim);font-size:.7rem;text-align:center}
.preview-box img{width:100%;height:100%;object-fit:cover}
.preview-inputs{flex:1;display:flex;flex-direction:column;gap:.5rem}

/* ── MODAL FOOTER ────────────────────────── */
.modal-footer{display:flex;justify-content:flex-end;gap:.6rem;margin-top:1.2rem;padding-top:1rem;border-top:1px solid var(--border)}

/* ── TOAST ───────────────────────────────── */
#toast{position:fixed;bottom:1.5rem;right:1.5rem;background:var(--accent);color:#111;padding:.55rem 1.1rem;border-radius:8px;font-size:.82rem;font-weight:600;z-index:300;transform:translateY(12px);opacity:0;transition:all .25s;pointer-events:none}
#toast.show{transform:translateY(0);opacity:1}

@media(max-width:600px){
  header{padding:0 1rem}
  .toolbar{padding:.75rem 1rem}
  main{padding:1rem}
  .header-stats{display:none}
}
</style>
</head>
<body>

<header>
  <div class="logo">Cine<span>Log</span></div>
  <div class="header-stats">
    <div class="stat"><strong id="stat-total">0</strong>movies</div>
    <div class="stat"><strong id="stat-avg">—</strong>avg rating</div>
    <div class="stat"><strong id="stat-dur">0h</strong>total runtime</div>
  </div>
</header>

<div class="toolbar">
  <input type="text" id="search" placeholder="Search movies…"/>
  <select id="sort">
    <option value="added">Recently added</option>
    <option value="title">Title A–Z</option>
    <option value="year-desc">Newest first</option>
    <option value="year-asc">Oldest first</option>
    <option value="rating-desc">Highest rated</option>
    <option value="duration-desc">Longest first</option>
  </select>
  <select id="filter-year">
    <option value="">All years</option>
  </select>
  <button class="btn btn-primary" id="add-btn">
    <svg width="14" height="14" viewBox="0 0 24 24" stroke="currentColor" fill="none" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    Add movie
  </button>
</div>

<main>
  <div id="grid">
    <div id="empty">
      <svg viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="20" rx="3"/><path d="M7 2v20M17 2v20M2 12h20M2 7h5M2 17h5M17 7h5M17 17h5"/></svg>
      <p style="font-size:1rem;margin-bottom:.4rem">No movies yet</p>
      <p style="font-size:.82rem">Click <strong>Add movie</strong> to start your list.</p>
    </div>
  </div>
</main>

<!-- ADD / EDIT MODAL -->
<div class="overlay" id="modal">
  <div class="modal">
    <h2 id="modal-title">Add movie</h2>
    <div class="form-grid">
      <div class="full">
        <label>Title *</label>
        <input type="text" id="f-title" placeholder="e.g. The Dark Knight"/>
      </div>
      <div>
        <label>Year</label>
        <input type="number" id="f-year" placeholder="2008" min="1888" max="2099"/>
      </div>
      <div>
        <label>Duration (min)</label>
        <input type="number" id="f-duration" placeholder="152" min="1"/>
      </div>
      <div>
        <label>Rating (1–10)</label>
        <input type="number" id="f-rating" placeholder="9.0" min="1" max="10" step="0.1"/>
      </div>
      <div>
        <label>Genre</label>
        <input type="text" id="f-genre" placeholder="Action, Drama…"/>
      </div>
      <div class="full preview-wrap">
        <div class="preview-box" id="preview-box">
          <span>Preview</span>
        </div>
        <div class="preview-inputs">
          <div>
            <label>Poster URL</label>
            <input type="url" id="f-poster" placeholder="https://…/poster.jpg"/>
          </div>
          <div>
            <label>Trailer URL (YouTube etc.)</label>
            <input type="url" id="f-trailer" placeholder="https://youtube.com/watch?v=…"/>
          </div>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" id="modal-cancel">Cancel</button>
      <button class="btn btn-primary" id="modal-save">Save movie</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
/* ══════════════════════════════════════════
   STATE
   ══════════════════════════════════════════ */
const STORAGE_KEY = 'cinelog_v1';

let state = {
  movies: [],
  search: '',
  sort: 'added',
  filterYear: ''
};

function loadFromStorage() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) state.movies = JSON.parse(raw);
  } catch(e) { state.movies = []; }
}

function saveToStorage() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state.movies));
}

/* ══════════════════════════════════════════
   DERIVED / HELPERS
   ══════════════════════════════════════════ */
function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2,7);
}

function fmtDuration(min) {
  if (!min) return '—';
  const h = Math.floor(min / 60), m = min % 60;
  return h ? `${h}h ${m}m` : `${m}m`;
}

function filteredMovies() {
  let list = [...state.movies];

  // search
  const q = state.search.toLowerCase();
  if (q) list = list.filter(m =>
    m.title.toLowerCase().includes(q) ||
    (m.genre || '').toLowerCase().includes(q)
  );

  // filter year
  if (state.filterYear) list = list.filter(m => String(m.year) === state.filterYear);

  // sort
  switch (state.sort) {
    case 'title':        list.sort((a,b) => a.title.localeCompare(b.title)); break;
    case 'year-desc':    list.sort((a,b) => (b.year||0) - (a.year||0)); break;
    case 'year-asc':     list.sort((a,b) => (a.year||0) - (b.year||0)); break;
    case 'rating-desc':  list.sort((a,b) => (b.rating||0) - (a.rating||0)); break;
    case 'duration-desc':list.sort((a,b) => (b.duration||0) - (a.duration||0)); break;
    default:             list.sort((a,b) => b._added - a._added);
  }

  return list;
}

function updateStats() {
  const all = state.movies;
  document.getElementById('stat-total').textContent = all.length;

  const rated = all.filter(m => m.rating);
  document.getElementById('stat-avg').textContent = rated.length
    ? (rated.reduce((s,m) => s + parseFloat(m.rating), 0) / rated.length).toFixed(1)
    : '—';

  const totMin = all.reduce((s,m) => s + (parseInt(m.duration)||0), 0);
  document.getElementById('stat-dur').textContent = totMin ? `${Math.round(totMin/60)}h` : '0h';
}

function updateYearFilter() {
  const sel = document.getElementById('filter-year');
  const current = sel.value;
  const years = [...new Set(state.movies.map(m => m.year).filter(Boolean))].sort((a,b) => b-a);
  sel.innerHTML = '<option value="">All years</option>' +
    years.map(y => `<option value="${y}" ${y==current?'selected':''}>${y}</option>`).join('');
}

/* ══════════════════════════════════════════
   RENDER UI  (State → DOM)
   ══════════════════════════════════════════ */
function render() {
  const grid = document.getElementById('grid');
  const empty = document.getElementById('empty');
  const list = filteredMovies();

  // remove existing cards (keep #empty)
  [...grid.querySelectorAll('.movie-card')].forEach(c => c.remove());

  if (!list.length) {
    empty.style.display = 'block';
    updateStats();
    return;
  }
  empty.style.display = 'none';

  list.forEach(movie => {
    const card = document.createElement('div');
    card.className = 'movie-card';
    card.dataset.id = movie.id;

    const posterHtml = movie.poster
      ? `<img src="${escHtml(movie.poster)}" alt="${escHtml(movie.title)}" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">`
      : '';
    const phStyle = movie.poster ? 'style="display:none"' : '';

    const trailerHtml = movie.trailer
      ? `<a class="trailer-link" href="${escHtml(movie.trailer)}" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg>
          Watch trailer
        </a>`
      : '';

    card.innerHTML = `
      <div class="poster-wrap">
        ${posterHtml}
        <div class="poster-placeholder" ${phStyle}>🎬</div>
        ${movie.rating ? `<div class="card-badge">★ ${parseFloat(movie.rating).toFixed(1)}</div>` : ''}
        <div class="card-actions">
          <button class="icon-btn" data-action="edit" title="Edit">
            <svg viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
          </button>
          <button class="icon-btn" data-action="delete" title="Delete" style="color:#e74c3c">
            <svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
          </button>
        </div>
      </div>
      <div class="card-body">
        <div class="card-title" title="${escHtml(movie.title)}">${escHtml(movie.title)}</div>
        <div class="card-meta">
          ${movie.year ? `<span>📅 ${movie.year}</span>` : ''}
          ${movie.duration ? `<span>⏱ ${fmtDuration(parseInt(movie.duration))}</span>` : ''}
          ${movie.genre ? `<span>🎭 ${escHtml(movie.genre)}</span>` : ''}
        </div>
        ${trailerHtml}
      </div>`;

    // event handlers on card buttons
    card.querySelector('[data-action="edit"]').addEventListener('click', e => {
      e.stopPropagation();
      openModal(movie.id);
    });
    card.querySelector('[data-action="delete"]').addEventListener('click', e => {
      e.stopPropagation();
      deleteMovie(movie.id);
    });

    grid.appendChild(card);
  });

  updateStats();
}

function escHtml(s) {
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

/* ══════════════════════════════════════════
   EVENT HANDLERS
   ══════════════════════════════════════════ */
document.getElementById('search').addEventListener('input', e => {
  state.search = e.target.value;
  render();
});

document.getElementById('sort').addEventListener('change', e => {
  state.sort = e.target.value;
  render();
});

document.getElementById('filter-year').addEventListener('change', e => {
  state.filterYear = e.target.value;
  render();
});

document.getElementById('add-btn').addEventListener('click', () => openModal(null));

/* ── MODAL ───────────────────────────────── */
let editingId = null;

function openModal(id) {
  editingId = id;
  const m = id ? state.movies.find(x => x.id === id) : null;

  document.getElementById('modal-title').textContent = id ? 'Edit movie' : 'Add movie';
  document.getElementById('f-title').value    = m?.title    || '';
  document.getElementById('f-year').value     = m?.year     || '';
  document.getElementById('f-duration').value = m?.duration || '';
  document.getElementById('f-rating').value   = m?.rating   || '';
  document.getElementById('f-genre').value    = m?.genre    || '';
  document.getElementById('f-poster').value   = m?.poster   || '';
  document.getElementById('f-trailer').value  = m?.trailer  || '';

  updatePreview(m?.poster || '');
  document.getElementById('modal').classList.add('open');
  document.getElementById('f-title').focus();
}

function closeModal() {
  document.getElementById('modal').classList.remove('open');
  editingId = null;
}

document.getElementById('modal-cancel').addEventListener('click', closeModal);
document.getElementById('modal').addEventListener('click', e => {
  if (e.target === document.getElementById('modal')) closeModal();
});

// live poster preview
document.getElementById('f-poster').addEventListener('input', e => {
  updatePreview(e.target.value);
});

function updatePreview(url) {
  const box = document.getElementById('preview-box');
  if (url) {
    box.innerHTML = `<img src="${url}" style="width:100%;height:100%;object-fit:cover" onerror="this.parentElement.innerHTML='<span>Bad URL</span>'">`;
  } else {
    box.innerHTML = '<span>Preview</span>';
  }
}

document.getElementById('modal-save').addEventListener('click', saveMovie);

function saveMovie() {
  const title = document.getElementById('f-title').value.trim();
  if (!title) {
    document.getElementById('f-title').focus();
    toast('Title is required');
    return;
  }

  const data = {
    title,
    year:     document.getElementById('f-year').value     || null,
    duration: document.getElementById('f-duration').value || null,
    rating:   document.getElementById('f-rating').value   || null,
    genre:    document.getElementById('f-genre').value.trim()   || null,
    poster:   document.getElementById('f-poster').value.trim()  || null,
    trailer:  document.getElementById('f-trailer').value.trim() || null,
  };

  if (editingId) {
    // UPDATE STATE
    const idx = state.movies.findIndex(m => m.id === editingId);
    if (idx !== -1) state.movies[idx] = { ...state.movies[idx], ...data };
    toast('Movie updated');
  } else {
    // ADD TO STATE
    state.movies.push({ id: uid(), _added: Date.now(), ...data });
    toast('Movie added');
  }

  saveToStorage();       // persist
  updateYearFilter();    // update UI
  closeModal();
  render();              // re-render UI
}

function deleteMovie(id) {
  if (!confirm('Delete this movie?')) return;
  // UPDATE STATE
  state.movies = state.movies.filter(m => m.id !== id);
  saveToStorage();
  updateYearFilter();
  render();
  toast('Deleted');
}

/* ── TOAST ───────────────────────────────── */
let toastTimer;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
}

/* ══════════════════════════════════════════
   INIT  (deserialize + first render)
   ══════════════════════════════════════════ */
loadFromStorage();
updateYearFilter();
render();
</script>
</body>
</html>
